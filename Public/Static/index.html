<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>SyncStream - Watch Together</title>
        <link rel="stylesheet" href="/style" />
        <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
        <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    </head>
    <body>
        <header class="app-header">
            <h1 class="logo">Sync<span>Stream</span></h1>

            <div class="sync-toggle-container">
                <span class="sync-label">Watch Party Sync</span>
                <label class="switch">
                    <input type="checkbox" id="sync-toggle" />
                    <span class="slider round"></span>
                </label>
            </div>
        </header>

        <main id="app-container">
            <section id="search-view" class="view active">
                <div class="search-container">
                    <h2>What do you want to watch?</h2>
                    <form id="search-form">
                        <input
                            type="text"
                            id="search-input"
                            placeholder="Search for anime (e.g., Dr. Stone)..."
                            required
                            autocomplete="off"
                        />
                        <button type="submit" id="search-btn">Search</button>
                    </form>
                </div>

                <div
                    id="continue-watching-container"
                    class="hidden"
                    style="margin-bottom: 2rem"
                >
                    <h3 style="color: var(--primary); margin-bottom: 1rem">
                        Continue Watching
                    </h3>
                    <div
                        id="continue-watching-controls"
                        class="horizontal-scroll-container"
                    ></div>
                </div>

                <div id="schedule-container">
                    <div class="schedule-header">
                        <h3 id="schedule-title" style="color: var(--primary)">
                            Loading Schedule...
                        </h3>
                        <div
                            id="schedule-controls"
                            class="schedule-controls"
                        ></div>
                    </div>
                    <div
                        id="schedule-grid"
                        class="grid"
                        style="margin-top: 1rem"
                    ></div>
                </div>

                <div id="loading-spinner" class="hidden">
                    Searching the archives...
                </div>

                <div id="results-grid" class="grid"></div>
            </section>

            <section id="watch-view" class="view hidden">
                <div class="player-header">
                    <button id="back-btn" class="secondary-btn">
                        ← Back to Search
                    </button>
                    <h2 id="current-show-title">Show Title</h2>
                </div>

                <div class="layout-wrapper">
                    <div class="player-column">
                        <div class="video-container">
                            <video
                                id="video-player"
                                controls
                                preload="auto"
                            ></video>
                            <div id="video-loading-overlay" class="hidden">
                                Buffering Stream...
                            </div>
                        </div>

                        <div
                            id="player-controls-container"
                            class="hidden player-controls"
                        >
                            <label class="autoplay-label">
                                <input type="checkbox" id="autoplay-toggle" />
                                Autoplay Next Episode
                            </label>

                            <button id="next-ep-btn" class="ep-btn next-btn">
                                ⏭ Skip to Next Episode
                            </button>
                        </div>
                    </div>

                    <div class="episode-sidebar">
                        <h3>Episodes</h3>
                        <div class="episode-controls">
                            <select id="dub-sub-toggle">
                                <option value="sub">Sub</option>
                                <option value="dub">Dub</option>
                            </select>
                        </div>
                        <div id="episode-grid" class="ep-grid"></div>
                    </div>
                </div>
            </section>
        </main>

        <script src="/logic"></script>
    </body>
</html>
